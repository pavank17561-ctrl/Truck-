name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unpack
        run: |
          newest() { git ls-files "$1" | while read -r f; do echo "$(git log -1 --format=%ct -- "$f")|$f"; done | sort -n | tail -1 | cut -d'|' -f2; }
          Z=$(newest "android*.zip")
          H=$(newest "truck-trip*.html")
          unzip -o "$Z"
          mkdir -p app/src/main/assets
          cp "$H" app/src/main/assets/index.html
      - run: gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
